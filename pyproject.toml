[project]
name = "python-monorepo-template"
version = "0.1.0"
description = "A uv workspace for Python services and shared packages"
requires-python = ">=3.12"

[tool.uv]
package = false
required-version = ">=0.11"

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[dependency-groups]
dev = [
    "pre-commit>=4,<5",
    "pytest>=8,<10",
    "ruff>=0.15,<1",
    "ty>=0.0.40,<0.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PTH", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
exclude = ["templates"]
