repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format --check
        language: system
        types_or: [python, pyi]
      - id: ty-check
        name: Type check workspace
        entry: uv run --all-packages --locked ty check
        language: system
        pass_filenames: false
        types_or: [python, pyi]
