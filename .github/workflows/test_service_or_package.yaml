name: Validate One Workspace Member

on:
  workflow_dispatch:
    inputs:
      target_path:
        description: "Workspace member path, for example services/my-service"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.4"
          python-version: "3.15"
          enable-cache: true
      - run: uv sync --all-packages --locked
      - name: Validate selected member
        env:
          TARGET_PATH: ${{ inputs.target_path }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_PATH" =~ ^(services|packages)/[a-z][a-z0-9_-]*$ ]] || [[ ! -f "$TARGET_PATH/pyproject.toml" ]]; then
            echo "Expected an existing services/<name> or packages/<name> workspace member" >&2
            exit 1
          fi
          cd "$TARGET_PATH"
          uv run --locked ruff check src tests
          uv run --locked ruff format --check src tests
          uv run --locked ty check src tests
          uv run --locked pytest tests
