name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.4"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --all-packages --locked
      - run: make lint
      - name: Check formatting
        if: ${{ !cancelled() }}
        run: uv run --locked ruff format --check --diff .
      - name: Check types
        if: ${{ !cancelled() }}
        run: make typecheck
      - name: Run tests
        if: ${{ !cancelled() }}
        run: make test

  smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arguments: --docker
          - os: macos-latest
            arguments: ""
          - os: windows-latest
            arguments: ""
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.4"
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked
      - name: Generate, test, build, and install workspace members
        run: uv run --locked python scripts/smoke_test.py ${{ matrix.arguments }}
