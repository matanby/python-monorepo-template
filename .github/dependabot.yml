version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      development-tools:
        patterns: ["pytest*", "ruff", "ty", "pre-commit"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directories:
      - /templates/service
      - /services/*
    schedule:
      interval: weekly
    groups:
      container-images:
        patterns: ["*"]
